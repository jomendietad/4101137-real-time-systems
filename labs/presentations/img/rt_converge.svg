<rect x="30.0" y="30.0" width="400.0" height="90.0" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="230.0" y="71.0" text-anchor="middle" font-size="22" font-weight="700" fill="#2563eb">Digital systems</text>
