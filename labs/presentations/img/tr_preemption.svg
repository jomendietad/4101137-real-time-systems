<circle cx="930" cy="204" r="13" fill="#2563eb"/><text x="930" y="210" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">8</text>
<circle cx="60" cy="414" r="13" fill="#2563eb"/><text x="60" y="420" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">1</text>
<text x="82" y="420" text-anchor="start" font-size="17" font-weight="400" fill="#0f172a">isr_enter: the 1 kHz tick</text>
