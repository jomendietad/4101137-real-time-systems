<text x="682" y="488" text-anchor="start" font-size="17" font-weight="400" fill="#0f172a">thread_switched_out(sampling) → switched_in(console)</text>
<circle cx="660" cy="516" r="13" fill="#2563eb"/><text x="660" y="522" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">8</text>
<text x="682" y="522" text-anchor="start" font-size="17" font-weight="400" fill="#0f172a">thread_busy_wait_exit: calib carries on</text>
