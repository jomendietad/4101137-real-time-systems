<circle cx="450" cy="44" r="13" fill="#2563eb"/><text x="450" y="50" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">3</text>
<circle cx="470" cy="204" r="13" fill="#2563eb"/><text x="470" y="210" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">4</text>
