# Every push: the documents against the course standard, and every firmware on
# every board (the same list as scripts/build_all.sh), on the pinned Zephyr.
name: CI

on:
  push:
  pull_request:

jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: course
      - uses: actions/checkout@v4
        with:
          repository: saacifuentesmu/course-kit
          path: course-kit
      - run: python3 course-kit/tools/coursekit.py lint course

  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: 4101137-real-time-systems
      - uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: 4101137-real-time-systems
          toolchains: arm-zephyr-eabi:xtensa-espressif_esp32s3_zephyr-elf:riscv64-zephyr-elf
      - run: 4101137-real-time-systems/scripts/build_all.sh
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: 4101137-real-time-systems/build/ci/*.log
