# Week 5 tracing demo: CTF out of the UART jack, started by the capture script.
#   west build ... -- -DEXTRA_CONF_FILE=trace.conf -DEXTRA_DTC_OVERLAY_FILE=uart_trace.overlay
CONFIG_TRACING=y
CONFIG_TRACING_CTF=y
CONFIG_TRACING_BACKEND_UART=y
CONFIG_TRACING_HANDLE_HOST_CMD=y
# Fits the trace under the 4 Mbaud link (≈ 0.37 of its 0.39 MB/s); a k_msgq call
# still shows as the ready or pend it causes.
CONFIG_TRACING_SYSCALL=n
CONFIG_TRACING_TIMER=n
CONFIG_TRACING_MESSAGE_QUEUE=n
CONFIG_TRACING_IDLE=n
# The defaults drain 100 ms after the first event into a 2 KB buffer: at this node's
# rate that keeps one 4 ms slice in every 100 ms. 32 KB holds the first ≈ 75 ms of
# a calib, while the lowest-priority tracer can't drain (65536 streams nothing).
CONFIG_TRACING_THREAD_WAIT_THRESHOLD=1
CONFIG_TRACING_BUFFER_SIZE=32768
