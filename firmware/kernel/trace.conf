# Week 5 tracing demo: CTF out of the USB jack, started by the capture script.
#   west build ... -- -DEXTRA_CONF_FILE=trace.conf -DEXTRA_DTC_OVERLAY_FILE=usb_trace.overlay
CONFIG_TRACING=y
CONFIG_TRACING_CTF=y
CONFIG_TRACING_BACKEND_UART=y
CONFIG_TRACING_HANDLE_HOST_CMD=y
CONFIG_TRACING_SYSCALL=n
CONFIG_TRACING_TIMER=n
